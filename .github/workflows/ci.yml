name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: illinoischat
      POSTGRES_USER: illinoischat
      POSTGRES_PASSWORD: test-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: illinoischat
          POSTGRES_USER: illinoischat
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U illinoischat -d illinoischat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl --fail http://localhost:9200/_cluster/health"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Test
        env:
          RUN_INTEGRATION_TESTS: "1"
          DOCUMENT_STORAGE_PATH: /tmp/illinois-chat-test-uploads
          EMBEDDING_CACHE_PATH: /tmp/illinois-chat-test-models
          RUN_OPENSEARCH_TESTS: "1"
          OPENSEARCH_HOST: localhost
          OPENSEARCH_PORT: 9200
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90

      - name: Verify migration round trip
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Validate Docker Compose
        run: docker compose config --quiet
