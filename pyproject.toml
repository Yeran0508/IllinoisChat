[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "illinois-chat"
version = "0.1.0"
description = "Interview-ready campus RAG platform with grounded answers and retrieval evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.15.2",
    "fastapi==0.115.12",
    "fastembed==0.9.1",
    "httpx==0.28.1",
    "pgvector==0.4.1",
    "psycopg[binary]==3.2.6",
    "pydantic-settings==2.9.1",
    "pypdf==5.4.0",
    "python-multipart==0.0.33",
    "sqlalchemy==2.0.40",
    "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
    "ruff==0.11.8",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["backend/tests"]
markers = ["integration: requires the migrated PostgreSQL test database"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
omit = ["*/app/evaluation/experiment.py", "*/app/evaluation/safety_experiment.py"]
